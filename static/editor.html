<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Part-Level 4DGS Editor</title>
  <style>
    :root{--bg:#09111d;--panel:#111c2c;--panel2:#182941;--line:#2a405f;--text:#e7eef8;--muted:#91a5c2;--accent:#45bbff;--yellow:#ffe45c;--danger:#ff6e7d}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}
    button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:4px;background:#1b2d47;padding:7px 10px;cursor:pointer}button:hover,button.active{border-color:var(--accent);background:#244365}button.danger{border-color:#6a3542;background:#3b202b}.app{height:100%;display:grid;grid-template-columns:260px minmax(360px,1fr) 330px;grid-template-rows:56px minmax(0,1fr) 210px}.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:#0e1726}.brand{font-weight:700;white-space:nowrap}.status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}.side{min-width:0;overflow:auto;padding:12px;background:var(--panel)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.section{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}.section h2{margin:0 0 9px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#c7d5e8}.row{display:flex;align-items:center;gap:7px;margin:7px 0}.grow{flex:1;min-width:0}.muted{color:var(--muted);font-size:12px}.file{display:none}input[type=text],input[type=number],select{width:100%;padding:6px;border:1px solid var(--line);border-radius:4px;background:#0b1525}input[type=color]{height:30px;width:42px;padding:1px;border:1px solid var(--line);background:#0b1525}.parts{display:flex;flex-direction:column;gap:3px}.part{display:flex;align-items:center;gap:7px;padding:7px;border:1px solid transparent;border-radius:4px;cursor:pointer}.part:hover,.part.active{background:var(--panel2);border-color:var(--line)}.swatch{width:11px;height:11px;border-radius:50%;flex:none}.count{margin-left:auto;color:var(--muted);font-size:11px}.viewport{position:relative;min-width:0;background:#070d16}.viewport canvas{display:block;width:100%;height:100%}.viewport.select-mode{cursor:crosshair}.hint{position:absolute;top:10px;left:12px;z-index:2;color:var(--muted);pointer-events:none}.selection{position:absolute;z-index:3;display:none;border:1px dashed var(--accent);background:#45bbff22;pointer-events:none}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kv label{font-size:11px;color:var(--muted)}.kv input{margin-top:3px}.slider-row{display:grid;grid-template-columns:28px minmax(0,1fr) 72px 44px;align-items:center;gap:5px;margin:6px 0}.slider-row label{color:var(--muted);font-size:11px}.slider-row input[type=range]{width:100%}.slider-value{text-align:right;color:var(--muted);font-size:11px}.timeline{grid-column:1/-1;overflow:auto;padding:10px 14px;border-top:1px solid var(--line);background:#0e1726}.timeline-head{display:flex;align-items:center;gap:8px;min-width:620px}.timeline-head input[type=number]{width:68px}.timeline-head input[type=range]{flex:1}.tracks{min-width:620px;margin-top:8px}.track-row{height:25px;position:relative;border:1px solid #1c2c44;border-bottom:0;background:#0a1321}.track-row:last-child{border-bottom:1px solid #1c2c44}.track-label{position:absolute;left:5px;top:4px;color:var(--muted);font-size:10px;pointer-events:none}.track-line{position:absolute;left:100px;right:0;top:0;bottom:0}.key{position:absolute;top:8px;width:9px;height:9px;background:var(--accent);transform:translateX(-50%) rotate(45deg);cursor:pointer}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;transform:translateX(-50%);pointer-events:none}.log{max-height:100px;overflow:auto;white-space:pre-wrap;color:var(--muted);font-size:11px}.modal{width:min(450px,calc(100% - 24px));padding:18px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}.modal::backdrop{background:#0009}.modal h2{margin:0 0 13px;font-size:15px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
    @media(max-width:1100px){.app{grid-template-columns:220px minmax(300px,1fr);grid-template-rows:56px minmax(0,1fr) 210px}.right{display:none}}@media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(300px,1fr) 210px}.left{display:none}.top{display:grid;grid-template-columns:1fr;gap:6px;height:auto;padding:8px 10px}.toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0}.toolbar button{padding:6px 2px;font-size:10px}.status{grid-row:3}.timeline-head{flex-wrap:wrap}.timeline-head input[type=range]{order:4;flex:1 0 100%}}
    .tracks{position:relative}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div class="brand">Part-Level 4DGS Editor</div><div id="status" class="status">No point cloud loaded</div><div class="toolbar"><button id="uploadBtn">Upload</button><button id="appendBtn">Add Files</button><button id="dirBtn">4DGS Dir</button><button id="orbitBtn" class="active">Orbit</button><button id="selectBtn">Select</button><button id="exportCurrentBtn">Export Current</button><button id="exportAllBtn">Export All</button></div></header>
    <aside class="side left">
      <div class="section"><h2>Data</h2><input id="uploadInput" class="file" type="file" multiple accept=".ply,.pt"><input id="appendInput" class="file" type="file" multiple accept=".ply,.pt"><div id="progress" class="muted"></div></div>
      <div class="section"><h2>Parts</h2><div id="parts" class="parts"></div><div class="row"><button id="createPartBtn" class="grow">Create Part</button><button id="deletePartBtn" class="danger">Delete</button></div><div id="selectionCount" class="muted">0 selected points</div></div>
      <div class="section"><h2>Viewport</h2><label class="muted">Point size<input id="pointSize" type="range" min="1" max="12" step=".5" value="3"></label><div class="row"><button id="resetViewBtn" class="grow">Reset View</button><button id="clearSelectionBtn">Clear</button></div></div>
      <div class="section"><h2>Log</h2><div id="log" class="log"></div></div>
    </aside>
    <main id="viewport" class="viewport"><div class="hint">Orbit: rotate, pan, zoom. Select: drag a rectangle.</div><div id="selection" class="selection"></div></main>
    <aside class="side right">
      <div class="section"><h2>Part</h2><div class="row"><label class="grow muted">Name<input id="partName" type="text"></label><label class="muted">Color<input id="partColor" type="color" value="#e63333"></label></div><div class="muted">Pivot (world coordinates)</div><div class="kv"><label>X<input id="pivot-x" type="number" step=".01"></label></label><label>Y<input id="pivot-y" type="number" step=".01"></label></label><label>Z<input id="pivot-z" type="number" step=".01"></label></label></div><div class="row"><button id="savePartBtn" class="grow">Save Part</button><button id="centroidBtn">Reset to Centroid</button></div></div>
      <div class="section"><h2>Transform</h2><div id="sliders"></div><button id="setKeyBtn" style="width:100%;margin-top:7px">Set Keyframe</button><button id="deleteKeyBtn" class="danger" style="width:100%;margin-top:6px">Delete KF</button><div id="keyList" class="muted" style="margin-top:8px"></div></div>
      <div class="section"><h2>Settings</h2><div class="row"><label class="grow muted">Total frames<input id="numFrames" type="number" min="2" max="10000" value="30"></label><label class="grow muted">Interpolation<select id="interp"><option value="linear">Linear</option><option value="catmull_rom">Catmull-Rom</option></select></label></div><button id="saveSettingsBtn" style="width:100%">Apply Settings</button></div>
    </aside>
    <section class="timeline"><div class="timeline-head"><button id="playBtn">Play</button><button id="stopBtn">Stop</button><span class="muted">Frame</span><input id="frameNumber" type="number" min="0" value="0"><input id="frameSlider" type="range" min="0" max="29" value="0"><span id="frameLabel" class="muted">0 / 29</span></div><div id="tracks" class="tracks"></div></section>
  </div>
  <dialog id="dirModal" class="modal"><h2>Load 4DGS Directory</h2><label class="muted">Server directory<input id="dirPath" type="text" placeholder="C:\\data\\frames"></label><label class="row muted"><input id="loopFrames" type="checkbox"> Loop source frames</label><div class="modal-actions"><button data-close="dirModal">Cancel</button><button id="loadDirBtn">Load</button></div></dialog>
  <dialog id="currentModal" class="modal"><h2>Export Current Frame</h2><label class="muted">Server output path<input id="currentPath" type="text" value="generated/current.pt"></label><div class="modal-actions"><button data-close="currentModal">Cancel</button><button id="doCurrentBtn">Export</button></div></dialog>
  <dialog id="allModal" class="modal"><h2>Export All Frames</h2><label class="muted">Server output directory<input id="allPath" type="text" value="generated/frames"></label><div class="modal-actions"><button data-close="allModal">Cancel</button><button id="doAllBtn">Export</button></div></dialog>
  <script src="/static/three.min.js"></script><script src="/static/OrbitControls.js"></script>
  <script>
    const $=id=>document.getElementById(id), sliders=['tx','ty','tz','rx','ry','rz'];
    let state={parts:[],tracks:{},num_frames:30,loaded:false,n_vertices:0}; let activePart=null,selectedIndices=[],points=null,scene,camera,renderer,controls,mode='orbit',drag=null,playing=false,originalPositions=null,partIds=null,pointColors=null,pivotMarker=null,frameTransforms={},previewToken=0,pivotSaveTimer=null;
    const defaults={tx:0,ty:0,tz:0,rx:0,ry:0,rz:0};
    function log(message){$('log').textContent=new Date().toLocaleTimeString()+' '+message+'\n'+$('log').textContent}
    async function api(url,options={}){let response;try{response=await fetch(url,options)}catch(error){log('Request failed: '+error.message);throw error}const type=response.headers.get('content-type')||'',data=type.includes('application/octet-stream')?await response.arrayBuffer():await response.json().catch(()=>({error:response.statusText}));if(!response.ok)throw Error(data.error||response.statusText);return data}
    function colorHex(rgb){return '#'+(rgb||[.5,.5,.5]).map(v=>Math.max(0,Math.min(255,Math.round(v*255))).toString(16).padStart(2,'0')).join('')}
    function makeSliders(){const root=$('sliders');sliders.forEach(name=>{const rotation=name[0]==='r';const row=document.createElement('div');row.className='slider-row';row.innerHTML='<label>'+name.toUpperCase()+'</label><input id="'+name+'-range" type="range" min="'+(rotation?-180:-5)+'" max="'+(rotation?180:5)+'" step="'+(rotation?.5:.01)+'"><input id="'+name+'-number" type="number" min="'+(rotation?-180:-5)+'" max="'+(rotation?180:5)+'" step="'+(rotation?.5:.01)+'"><span id="'+name+'-value" class="slider-value">0</span>';root.appendChild(row);const sync=e=>{const value=Number(e.target.value);$(''+name+'-range').value=value;$(''+name+'-number').value=value;$(''+name+'-value').textContent=value.toFixed(rotation?1:2);previewAllTransforms()};$(''+name+'-range').addEventListener('input',sync);$(''+name+'-number').addEventListener('input',sync)})}
    function uiTransform(){const out={};sliders.forEach(name=>{const value=Number($(''+name+'-number').value)||0;out[name]=name[0]==='r'?value*Math.PI/180:value});return out}
    function setUiTransform(tf){sliders.forEach(name=>{const value=name[0]==='r'?(Number(tf&&tf[name]||0)*180/Math.PI):Number(tf&&tf[name]||0);$(''+name+'-range').value=value;$(''+name+'-number').value=value;$(''+name+'-value').textContent=value.toFixed(name[0]==='r'?1:2)})}
    function renderPartsList(){const root=$('parts');root.innerHTML='';state.parts.forEach(part=>{const row=document.createElement('div');row.className='part '+(part.id===activePart?'active':'');const label=part.is_4dgs?part.name+' 4DGS:'+part.n_frames_src:part.name;row.innerHTML='<span class="swatch" style="background:'+colorHex(part.color)+'"></span><span class="grow">'+label+'</span><span class="count">'+(part.is_4dgs?(part.n_vertices||0):part.n_vertices)+' pts</span>';row.onclick=()=>selectPart(part.id);root.appendChild(row)})}
    async function loadParts(){const result=await api('/api/parts');state.parts=result.parts||[];renderPartsList();return state.parts}
    async function selectPart(pid){activePart=pid;const part=state.parts.find(item=>item.id===pid);if(!part)return; $('partName').value=part.name;$('partColor').value=colorHex(part.color);['x','y','z'].forEach((axis,i)=>$('pivot-'+axis).value=part.pivot[i]);renderPartsList();renderKeys();try{frameTransforms=await api('/api/frame_transforms/'+currentFrame());setUiTransform(frameTransforms[String(pid)]||defaults)}catch(error){log(error.message)}updatePivotMarker();previewAllTransforms()}
    function renderKeys(){const keys=activePart===null?[]:(state.tracks[String(activePart)]||[]);$('keyList').innerHTML=keys.length?keys.map(k=>'Frame '+k.frame+' <button class="delete-inline" data-frame="'+k.frame+'">Delete</button>').join('<br>'):'No keyframes';document.querySelectorAll('.delete-inline').forEach(button=>button.onclick=()=>deleteKeyframe(Number(button.dataset.frame)));renderTimeline()}
    function renderTimeline(){const root=$('tracks');root.innerHTML='';const max=Math.max(1,state.num_frames-1);state.parts.forEach(part=>{const row=document.createElement('div');row.className='track-row';row.innerHTML='<span class="track-label">'+part.name+'</span><div class="track-line"></div>';const line=row.firstElementChild.nextElementSibling;line.onclick=e=>{const r=line.getBoundingClientRect();setFrame(Math.round(((e.clientX-r.left)/Math.max(1,r.width))*max))};(state.tracks[String(part.id)]||[]).forEach(key=>{const marker=document.createElement('div');marker.className='key';marker.style.left=(key.frame/max*100)+'%';marker.title='Frame '+key.frame;marker.onclick=e=>{e.stopPropagation();setFrame(key.frame)};line.appendChild(marker)});root.appendChild(row)});const head=document.createElement('div');head.className='playhead';head.id='playhead';$('tracks').appendChild(head);updatePlayhead()}
    function updatePlayhead(){const head=$('playhead');if(head)head.style.left=(currentFrame()/Math.max(1,state.num_frames-1)*100)+'%'}
    function updateFrameDisplay(){const frame=currentFrame();$('frameNumber').value=frame;$('frameSlider').value=frame;$('frameLabel').textContent=frame+' / '+Math.max(1,state.num_frames-1);updatePlayhead()}
    function currentFrame(){return Math.max(0,Math.min(Math.max(0,state.num_frames-1),Number($('frameNumber').value)||0))}
    function setupSelectionEvents(){renderer.domElement.addEventListener('pointerdown',onMouseDown);renderer.domElement.addEventListener('pointermove',onMouseMove);renderer.domElement.addEventListener('pointerup',onMouseUp)}
    function initThree(){scene=new THREE.Scene();scene.background=new THREE.Color(0x070d16);camera=new THREE.PerspectiveCamera(55,1,.01,10000);camera.up.set(0,0,1);camera.position.set(3,-4,2.5);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);$('viewport').appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const grid=new THREE.GridHelper(20,20,0x3b536f,0x1d2c42);grid.rotation.x=Math.PI/2;scene.add(grid);scene.add(new THREE.AxesHelper(2));setupSelectionEvents();window.addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{if(controls.enabled)controls.update();renderer.render(scene,camera)})}
    function resize(){const rect=$('viewport').getBoundingClientRect();camera.aspect=Math.max(.1,rect.width/Math.max(1,rect.height));camera.updateProjectionMatrix();renderer.setSize(rect.width,rect.height)}
    function setMode(next){mode=next;controls.enabled=next==='orbit';$('viewport').classList.toggle('select-mode',next==='select');$('orbitBtn').classList.toggle('active',next==='orbit');$('selectBtn').classList.toggle('active',next==='select');if(next!=='select'){$('selection').style.display='none';drag=null}}
    function onMouseDown(e){if(mode!=='select'||e.button!==0)return;const r=renderer.domElement.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top,additive:e.shiftKey};const box=$('selection');Object.assign(box.style,{display:'block',left:drag.x+'px',top:drag.y+'px',width:'0px',height:'0px'})}
    function onMouseMove(e){if(!drag)return;const r=renderer.domElement.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,left=Math.min(drag.x,x),top=Math.min(drag.y,y);Object.assign($('selection').style,{left:left+'px',top:top+'px',width:Math.abs(x-drag.x)+'px',height:Math.abs(y-drag.y)+'px'})}
    function onMouseUp(e){if(!drag)return;const r=renderer.domElement.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;performBoxSelect({x:drag.x,y:drag.y},{x,y},drag.additive);drag=null;$('selection').style.display='none'}
    function performBoxSelect(start,end,additive=false){if(!points||!originalPositions)return;const left=Math.min(start.x,end.x),right=Math.max(start.x,end.x),top=Math.min(start.y,end.y),bottom=Math.max(start.y,end.y),width=renderer.domElement.clientWidth,height=renderer.domElement.clientHeight,selected=additive?new Set(selectedIndices):new Set();const matrix=new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse),world=new THREE.Vector4(),clip=new THREE.Vector4(),display=points.geometry.attributes.position;for(let i=0;i<display.count;i++){if(i>=state.n_vertices||partIds[i]<0||partIds[i]===undefined)continue;world.set(display.getX(i),display.getY(i),display.getZ(i),1);clip.copy(world).applyMatrix4(matrix);if(clip.w<=0||clip.z<-clip.w||clip.z>clip.w)continue;const ndcX=clip.x/clip.w,ndcY=clip.y/clip.w,sx=(ndcX+1)*width/2,sy=(1-ndcY)*height/2;if(sx>=left&&sx<=right&&sy>=top&&sy<=bottom)selected.add(i)}selectedIndices=[...selected];updateSelectionColors();$('selectionCount').textContent=selectedIndices.length+' selected points';log('Selected '+selectedIndices.length+' static points')}
    function updateSelectionColors(){if(!points)return;const colors=points.geometry.attributes.color.array,selected=new Set(selectedIndices);for(let i=0;i<partIds.length;i++){const baseOffset=i*3;if(selected.has(i)){colors[baseOffset]=1;colors[baseOffset+1]=.9;colors[baseOffset+2]=.1}else{colors[baseOffset]=pointColors[baseOffset];colors[baseOffset+1]=pointColors[baseOffset+1];colors[baseOffset+2]=pointColors[baseOffset+2]}}points.geometry.attributes.color.needsUpdate=true}
    function parsePointCloud(buffer,withMetadata=true){const view=new DataView(buffer);if(buffer.byteLength<4)throw Error('Point-cloud response is truncated');const n=view.getUint32(0,true),xyzOffset=4,colorOffset=xyzOffset+n*12,pidOffset=colorOffset+n*12;if(withMetadata&&buffer.byteLength<pidOffset+n*4)throw Error('Point-cloud response has invalid length');const positions=new Float32Array(buffer,xyzOffset,n*3);if(!withMetadata)return{n,positions,colors:new Float32Array(n*3),partIds:new Int32Array(n).fill(-1)};return{n,positions,colors:new Float32Array(buffer,colorOffset,n*3),partIds:new Int32Array(buffer,pidOffset,n)}}
    function buildPointCloud(pos,colors,ids){if(points){scene.remove(points);points.geometry.dispose();points.material.dispose()}originalPositions=new Float32Array(pos);pointIds=ids;partIds=new Int32Array(ids);pointColors=new Float32Array(colors);const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));geometry.setAttribute('color',new THREE.BufferAttribute(new Float32Array(colors),3));points=new THREE.Points(geometry,new THREE.PointsMaterial({size:Number($('pointSize').value),vertexColors:true,sizeAttenuation:false}));scene.add(points);if(!camera.userData.fitted&&pos.length){const box=new THREE.Box3().setFromObject(points),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length()||1;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size,-size,size*.7));camera.userData.fitted=true}updateSelectionColors()}
    let pointIds;
    async function loadPointCloud(frame=currentFrame()){const useFrameEndpoint=Boolean(state.has_4dgs);const parsed=parsePointCloud(await api(useFrameEndpoint?('/api/frame/'+encodeURIComponent(frame)):('/api/pointcloud?frame='+encodeURIComponent(frame))),useFrameEndpoint);selectedIndices=[];$('selectionCount').textContent='0 selected points';buildPointCloud(parsed.positions,parsed.colors,parsed.partIds);$('status').textContent=(state.filename||'Point cloud')+' | '+parsed.n+' points | '+state.parts.length+' Parts';await loadFrameTransforms(frame);previewAllTransforms()}
    async function loadFrameTransforms(frame){try{frameTransforms=await api('/api/frame_transforms/'+frame)}catch(error){frameTransforms={};log(error.message)}}
    function rotationMatrix(rx,ry,rz){const cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry),cz=Math.cos(rz),sz=Math.sin(rz);return[[cz*cy,cz*sy*sx-sz*cx,cz*sy*cx+sz*sx],[sz*cy,sz*sy*sx+cz*cx,sz*sy*cx-cz*sx],[-sy,cy*sx,cy*cx]]}
    function transformPoint(x,y,z,pivot,tf){const r=rotationMatrix(tf.rx,tf.ry,tf.rz),dx=x-pivot[0],dy=y-pivot[1],dz=z-pivot[2];return[r[0][0]*dx+r[0][1]*dy+r[0][2]*dz+pivot[0]+tf.tx,r[1][0]*dx+r[1][1]*dy+r[1][2]*dz+pivot[1]+tf.ty,r[2][0]*dx+r[2][1]*dy+r[2][2]*dz+pivot[2]+tf.tz]}
    async function previewAllTransforms(){if(!points||!originalPositions||!partIds)return;const token=++previewToken;if(!frameTransforms||Object.keys(frameTransforms).length===0)await loadFrameTransforms(currentFrame());if(token!==previewToken)return;const current=activePart===null?null:uiTransform(),out=new Float32Array(originalPositions.length);for(let i=0;i<partIds.length;i++){const pid=partIds[i],part=state.parts.find(item=>item.id===pid),tf=pid===activePart?current:(frameTransforms[String(pid)]||defaults),p=part?transformPoint(originalPositions[i*3],originalPositions[i*3+1],originalPositions[i*3+2],part.pivot,tf):[originalPositions[i*3],originalPositions[i*3+1],originalPositions[i*3+2]];out.set(p,i*3)}points.geometry.attributes.position.array.set(out);points.geometry.attributes.position.needsUpdate=true;updatePivotMarker()}
    function updatePivotMarker(){if(activePart===null||!state.parts.find(item=>item.id===activePart)){if(pivotMarker)pivotMarker.visible=false;return}const part=state.parts.find(item=>item.id===activePart),tf=uiTransform();if(!pivotMarker){pivotMarker=new THREE.Mesh(new THREE.SphereGeometry(.05,12,8),new THREE.MeshBasicMaterial({color:0xffc247}));scene.add(pivotMarker)}pivotMarker.visible=true;pivotMarker.position.set(part.pivot[0]+tf.tx,part.pivot[1]+tf.ty,part.pivot[2]+tf.tz)}
    async function refresh(){state=await api('/api/state');$('numFrames').value=state.num_frames;$('interp').value=state.interpolation_method;$('frameSlider').max=Math.max(1,state.num_frames-1);$('frameNumber').max=Math.max(1,state.num_frames-1);await loadParts();renderTimeline();if(state.loaded||state.has_4dgs)await loadPointCloud(currentFrame());else{$('status').textContent='No point cloud loaded';if(points){scene.remove(points);points=null}}}
    async function setFrame(value){const frame=Math.max(0,Math.min(Math.max(0,state.num_frames-1),Number(value)||0));$('frameNumber').value=frame;updateFrameDisplay();await loadPointCloud(frame);if(activePart!==null)setUiTransform(frameTransforms[String(activePart)]||defaults);previewAllTransforms()}
    async function playAnimation(){if(playing)return;playing=true;while(playing){await setFrame((currentFrame()+1)%Math.max(1,state.num_frames));await new Promise(resolve=>setTimeout(resolve,50))}}
    function stopAnimation(){playing=false}
    async function deleteKeyframe(frame=currentFrame()){if(activePart===null)return;try{await api('/api/keyframes/'+activePart+'/'+frame,{method:'DELETE'});await refresh();if(activePart!==null)await selectPart(activePart)}catch(error){log(error.message)}}
    async function savePivot(){if(activePart===null)return;const pivot=['x','y','z'].map(axis=>Number($('pivot-'+axis).value)||0),part=state.parts.find(item=>item.id===activePart);if(part)part.pivot=pivot;updatePivotMarker();previewAllTransforms();clearTimeout(pivotSaveTimer);pivotSaveTimer=setTimeout(async()=>{try{await api('/api/parts/'+activePart,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({pivot})});await loadParts()}catch(error){log(error.message)}},180)}
    function wireEvents(){makeSliders();$('uploadBtn').onclick=()=>$('uploadInput').click();$('appendBtn').onclick=()=>$('appendInput').click();$('uploadInput').onchange=()=>uploadFiles($('uploadInput'),'/api/upload');$('appendInput').onchange=()=>uploadFiles($('appendInput'),'/api/upload_append');$('orbitBtn').onclick=()=>setMode('orbit');$('selectBtn').onclick=()=>setMode('select');$('pointSize').oninput=()=>{if(points)points.material.size=Number($('pointSize').value)};$('resetViewBtn').onclick=()=>{camera.userData.fitted=false;camera.position.set(3,-4,2.5);controls.target.set(0,0,0)};$('clearSelectionBtn').onclick=()=>{selectedIndices=[];updateSelectionColors();$('selectionCount').textContent='0 selected points'};$('createPartBtn').onclick=async()=>{if(!selectedIndices.length)return log('Select vertices first');try{await api('/api/parts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vertex_indices:selectedIndices})});selectedIndices=[];await refresh()}catch(error){log(error.message)}};$('deletePartBtn').onclick=async()=>{if(activePart===null)return;try{await api('/api/parts/'+activePart,{method:'DELETE'});activePart=null;await refresh()}catch(error){log(error.message)}};$('savePartBtn').onclick=async()=>{if(activePart===null)return;const hex=$('partColor').value;try{await api('/api/parts/'+activePart,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('partName').value,color:[parseInt(hex.slice(1,3),16)/255,parseInt(hex.slice(3,5),16)/255,parseInt(hex.slice(5,7),16)/255],pivot:['x','y','z'].map(axis=>Number($('pivot-'+axis).value)||0)})});await refresh();await selectPart(activePart)}catch(error){log(error.message)}};['x','y','z'].forEach(axis=>$('pivot-'+axis).addEventListener('input',savePivot));$('centroidBtn').onclick=async()=>{if(activePart===null)return;try{const result=await api('/api/parts/'+activePart+'/centroid');['x','y','z'].forEach((axis,i)=>$('pivot-'+axis).value=result.pivot[i]);await savePivot();await refresh();await selectPart(activePart)}catch(error){log(error.message)}};$('setKeyBtn').onclick=async()=>{if(activePart===null)return;try{await api('/api/keyframes/'+activePart,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({frame:currentFrame(),...uiTransform()})});await refresh();await selectPart(activePart)}catch(error){log(error.message)}};$('deleteKeyBtn').onclick=()=>deleteKeyframe();$('saveSettingsBtn').onclick=async()=>{try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({num_frames:Number($('numFrames').value),interpolation_method:$('interp').value})});await refresh()}catch(error){log(error.message)}};$('frameSlider').oninput=()=>setFrame($('frameSlider').value);$('frameNumber').onchange=()=>setFrame($('frameNumber').value);$('playBtn').onclick=playAnimation;$('stopBtn').onclick=stopAnimation;$('dirBtn').onclick=()=>$('dirModal').showModal();$('loadDirBtn').onclick=async()=>{try{await api('/api/upload_4dgs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir_path:$('dirPath').value,loop:$('loopFrames').checked})});$('dirModal').close();await refresh();log('4DGS directory loaded')}catch(error){log(error.message)}};$('exportCurrentBtn').onclick=()=>$('currentModal').showModal();$('exportAllBtn').onclick=()=>$('allModal').showModal();$('doCurrentBtn').onclick=async()=>{stopAnimation();try{const result=await api('/api/export_current',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({output_path:$('currentPath').value,frame:currentFrame()})});$('currentModal').close();log('Exported '+result.output_path+' ('+result.n_vertices+' points)')}catch(error){log(error.message)}};$('doAllBtn').onclick=async()=>{stopAnimation();try{await api('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({output_dir:$('allPath').value})});$('allModal').close();const poll=setInterval(async()=>{try{const result=await api('/api/export/status');$('progress').textContent=result.progress>=0?'Export '+result.progress+'%':'Export failed';if(result.done||result.progress<0){clearInterval(poll);if(result.done)log('Export complete: '+result.output_dir)}}catch(error){clearInterval(poll);log(error.message)}},250)}catch(error){log(error.message)}};document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).close())}
    // Keep playback failures in the visible log instead of producing an unhandled promise.
    let partTransforms={};
    async function loadFrameTransforms(frame){try{partTransforms=await api('/api/frame_transforms/'+frame);frameTransforms=partTransforms}catch(error){partTransforms={};frameTransforms=partTransforms;log(error.message)}}
    async function playAnimation(){if(playing)return;playing=true;try{while(playing){await setFrame((currentFrame()+1)%Math.max(1,state.num_frames));await new Promise(resolve=>setTimeout(resolve,50))}}catch(error){log(error.message)}finally{playing=false}}
    async function uploadFiles(input,endpoint){if(!input.files.length)return;const form=new FormData();[...input.files].forEach(file=>form.append('file',file));$('progress').textContent='Uploading...';try{await api(endpoint,{method:'POST',body:form});input.value='';await refresh();log('Upload complete')}catch(error){log(error.message)}$('progress').textContent=''}
    initThree();wireEvents();refresh().catch(error=>log(error.message));
  </script>
</body>
