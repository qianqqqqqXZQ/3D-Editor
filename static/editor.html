<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Part-Level 4DGS Editor</title>
  <style>
    :root{--bg:#0a101b;--panel:#111b2b;--panel2:#17253a;--line:#2a3c57;--text:#e8eef8;--muted:#91a4c2;--accent:#42b9ff;--danger:#ff6b78}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}
    button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:#1b2b43;border-radius:4px;padding:7px 10px;cursor:pointer}button:hover,button.active{border-color:var(--accent);background:#223b5a}button.danger{border-color:#63313d;background:#3a1e2a}.app{height:100%;display:grid;grid-template-columns:250px minmax(350px,1fr) 310px;grid-template-rows:54px minmax(0,1fr) 178px}
    header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:#0e1726}.brand{font-size:15px;font-weight:700;white-space:nowrap}.status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}.toolbar button{padding:6px 8px}
    aside{min-width:0;overflow:auto;padding:12px;background:var(--panel)}aside.left{border-right:1px solid var(--line)}aside.right{border-left:1px solid var(--line)}.section{padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid var(--line)}.section h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#c1d0e5;margin:0 0 9px}.row{display:flex;align-items:center;gap:7px;margin:7px 0}.grow{flex:1;min-width:0}.muted{color:var(--muted);font-size:12px}.file{display:none}input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:4px;background:#0b1422;padding:6px}input[type=color]{height:30px;width:42px;padding:1px;border:1px solid var(--line);background:#0b1422}.parts{display:flex;flex-direction:column;gap:4px}.part{display:flex;align-items:center;gap:7px;padding:7px;border:1px solid transparent;border-radius:4px;cursor:pointer}.part:hover,.part.active{background:var(--panel2);border-color:var(--line)}.swatch{width:11px;height:11px;border-radius:50%;flex:none}.count{margin-left:auto;color:var(--muted);font-size:11px}
    .viewport{position:relative;min-width:0;background:#070c14}.viewport canvas{display:block;width:100%;height:100%}.hint{position:absolute;left:12px;top:10px;z-index:2;color:var(--muted);pointer-events:none}.selection{position:absolute;z-index:3;display:none;border:1px dashed var(--accent);background:#42b9ff22;pointer-events:none}.timeline{grid-column:1/-1;padding:10px 14px;border-top:1px solid var(--line);background:#0e1726}.timeline-head{display:flex;align-items:center;gap:8px}.timeline-head input[type=number]{width:68px}.timeline-head input[type=range]{flex:1}.track{height:46px;margin-top:9px;position:relative;border:1px solid var(--line);border-radius:4px;background:#09111e}.ticks{display:flex;justify-content:space-between;padding:3px 5px;color:var(--muted);font-size:10px}.key{position:absolute;top:24px;width:9px;height:9px;background:var(--accent);transform:translateX(-50%) rotate(45deg)}.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);transform:translateX(-50%)}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kv label{font-size:11px;color:var(--muted)}.kv input{margin-top:3px}.modal{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);width:min(440px,calc(100% - 24px));padding:18px}.modal::backdrop{background:#0009}.modal h2{font-size:15px;margin:0 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.log{max-height:100px;overflow:auto;white-space:pre-wrap;color:var(--muted);font-size:11px}
    @media(max-width:1100px){.app{grid-template-columns:210px minmax(300px,1fr);grid-template-rows:54px minmax(0,1fr) 178px}.right{display:none}}
    @media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(300px,1fr) 178px}.left{display:none}header{display:grid;grid-template-columns:1fr;gap:6px;height:auto;padding:8px 10px}.brand{grid-row:1}.toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;margin:0;gap:5px;justify-content:stretch}.toolbar button{min-width:0;padding:6px 2px;font-size:10px;white-space:normal}.status{grid-row:3;min-width:0}.timeline-head{flex-wrap:wrap}.timeline-head input[type=range]{order:4;flex:1 0 100%}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Part-Level 4DGS Editor</div>
      <div id="status" class="status">No point cloud loaded</div>
      <div class="toolbar">
        <button id="uploadBtn">Upload</button><button id="appendBtn">Add Files</button><button id="dirBtn">4DGS Dir</button>
        <button id="orbitBtn" class="active">Orbit</button><button id="selectBtn">Select</button><button id="exportCurrentBtn">Export Cur .pt</button><button id="exportAllBtn">Export All</button>
      </div>
    </header>
    <aside class="left">
      <div class="section"><h2>Data</h2><input id="uploadInput" class="file" type="file" multiple accept=".ply,.pt"><input id="appendInput" class="file" type="file" multiple accept=".ply,.pt"><div id="progress" class="muted"></div></div>
      <div class="section"><h2>Parts</h2><div id="parts" class="parts"></div><div class="row"><button id="createPartBtn" class="grow">Create Part</button><button id="deletePartBtn" class="danger">Delete</button></div></div>
      <div class="section"><h2>Viewport</h2><div class="row"><label class="grow muted">Point size<input id="pointSize" type="range" min="1" max="12" step=".5" value="3"></label></div><div class="row"><button id="resetViewBtn" class="grow">Reset View</button><button id="clearSelectionBtn">Clear</button></div></div>
      <div class="section"><h2>Log</h2><div id="log" class="log"></div></div>
    </aside>
    <main id="viewport" class="viewport"><div class="hint">Orbit: drag and wheel. Select: drag a rectangle.</div><div id="selection" class="selection"></div></main>
    <aside class="right">
      <div class="section"><h2>Part</h2><div class="row"><label class="grow muted">Name<input id="partName" type="text"></label><label class="muted">Color<input id="partColor" type="color" value="#e63333"></label></div><div class="muted">Pivot</div><div class="kv"><label>X<input id="px" type="number" step=".01"></label><label>Y<input id="py" type="number" step=".01"></label><label>Z<input id="pz" type="number" step=".01"></label></div><div class="row"><button id="savePartBtn" class="grow">Save Part</button><button id="centroidBtn">Reset to Centroid</button></div></div>
      <div class="section"><h2>Transform</h2><div class="muted">Translation</div><div class="kv"><label>X<input id="tx" type="number" step=".01" value="0"></label><label>Y<input id="ty" type="number" step=".01" value="0"></label><label>Z<input id="tz" type="number" step=".01" value="0"></label></div><div class="muted" style="margin-top:8px">Rotation (radians)</div><div class="kv"><label>X<input id="rx" type="number" step=".01" value="0"></label><label>Y<input id="ry" type="number" step=".01" value="0"></label><label>Z<input id="rz" type="number" step=".01" value="0"></label></div><button id="setKeyBtn" style="width:100%;margin-top:9px">Set Keyframe</button><div id="keyList" class="muted" style="margin-top:8px"></div></div>
      <div class="section"><h2>Settings</h2><div class="row"><label class="grow muted">Total frames<input id="numFrames" type="number" min="2" max="10000" value="30"></label><label class="grow muted">Interpolation<select id="interp"><option value="linear">Linear</option><option value="catmull_rom">Catmull-Rom</option></select></label></div><button id="saveSettingsBtn" style="width:100%">Apply Settings</button></div>
    </aside>
    <section class="timeline"><div class="timeline-head"><button id="playBtn">Play</button><button id="stopBtn">Stop</button><span class="muted">Frame</span><input id="frameNumber" type="number" min="0" value="0"><input id="frameSlider" type="range" min="0" max="29" value="0"><span id="frameLabel" class="muted">0 / 29</span></div><div id="track" class="track"><div class="ticks"><span>0</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div><div id="playhead" class="playhead" style="left:0%"></div></div></section>
  </div>
  <dialog id="dirModal" class="modal"><h2>Load 4DGS Directory</h2><label class="muted">Server directory path<input id="dirPath" type="text" placeholder="C:\\data\\frames"></label><label class="row muted"><input id="loopFrames" type="checkbox"> Loop source frames</label><div class="modal-actions"><button data-close="dirModal">Cancel</button><button id="loadDirBtn">Load</button></div></dialog>
  <dialog id="currentModal" class="modal"><h2>Export Current Frame</h2><label class="muted">Output path<input id="currentPath" type="text" value="generated/current.pt"></label><div class="modal-actions"><button data-close="currentModal">Cancel</button><button id="doCurrentBtn">Export</button></div></dialog>
  <dialog id="allModal" class="modal"><h2>Export All Frames</h2><label class="muted">Output directory<input id="allPath" type="text" value="generated/frames"></label><div class="modal-actions"><button data-close="allModal">Cancel</button><button id="doAllBtn">Export</button></div></dialog>
  <script src="/static/three.min.js"></script><script src="/static/OrbitControls.js"></script>
  <script>
    const $=id=>document.getElementById(id); let state={parts:[],tracks:{},num_frames:30,loaded:false,n_vertices:0};
    let selectedPid=null,selectedIndices=[],points=null,scene,camera,renderer,controls,mode='orbit',playing=null,drag=null,originalPositions=null,partIds=null,pointColors=null,pivotMarker=null;
    function log(message){$('log').textContent=new Date().toLocaleTimeString()+' '+message+'\n'+$('log').textContent}
    async function api(url,options={}){const response=await fetch(url,options);const type=response.headers.get('content-type')||'';const data=type.includes('application/octet-stream')?await response.arrayBuffer():await response.json();if(!response.ok)throw Error(data.error||response.statusText);return data}
    function colorHex(rgb){return '#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v*255))).toString(16).padStart(2,'0')).join('')}
    function refreshParts(){const root=$('parts');root.innerHTML='';state.parts.forEach(part=>{const row=document.createElement('div');row.className='part '+(part.id===selectedPid?'active':'');row.onclick=()=>selectPart(part.id);row.innerHTML='<span class="swatch" style="background:'+colorHex(part.color)+'"></span><span>'+part.name+'</span><span class="count">'+part.n_vertices+'</span>';root.appendChild(row)})}
    function selectPart(pid){selectedPid=pid;const part=state.parts.find(p=>p.id===pid);if(!part)return;$('partName').value=part.name;$('partColor').value=colorHex(part.color);['x','y','z'].forEach((axis,i)=>$('p'+axis).value=part.pivot[i]);renderKeys();refreshParts();previewAllTransforms()}
    function renderKeys(){const keys=selectedPid===null?[]:(state.tracks[String(selectedPid)]||[]);$('keyList').innerHTML=keys.length?keys.map(k=>'Frame '+k.frame+': T('+k.tx.toFixed(2)+', '+k.ty.toFixed(2)+', '+k.tz.toFixed(2)+') R('+k.rx.toFixed(2)+', '+k.ry.toFixed(2)+', '+k.rz.toFixed(2)+') <button data-frame="'+k.frame+'" class="delete-kf">Delete</button>').join('<br>'):'No keyframes';document.querySelectorAll('.delete-kf').forEach(b=>b.onclick=async()=>{try{await api('/api/keyframes/'+selectedPid+'/'+b.dataset.frame,{method:'DELETE'});await refresh()}catch(e){log(e.message)}});renderTrack()}
    function renderTrack(){document.querySelectorAll('.key').forEach(e=>e.remove());if(selectedPid===null)return;(state.tracks[String(selectedPid)]||[]).forEach(k=>{const el=document.createElement('div');el.className='key';el.style.left=(k.frame/Math.max(1,state.num_frames-1)*100)+'%';$('track').appendChild(el)})}
    function initThree(){scene=new THREE.Scene();scene.background=new THREE.Color(0x070c14);camera=new THREE.PerspectiveCamera(55,1,.01,10000);camera.up.set(0,0,1);camera.position.set(3,-4,2.5);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);$('viewport').appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);const grid=new THREE.GridHelper(20,20,0x3b536f,0x1d2c42);grid.rotation.x=Math.PI/2;scene.add(grid);scene.add(new THREE.AxesHelper(2));window.addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});renderer.domElement.addEventListener('pointerdown',startSelect);renderer.domElement.addEventListener('pointermove',moveSelect);renderer.domElement.addEventListener('pointerup',endSelect)}
    function resize(){const rect=$('viewport').getBoundingClientRect();camera.aspect=Math.max(.1,rect.width/Math.max(1,rect.height));camera.updateProjectionMatrix();renderer.setSize(rect.width,rect.height)}
    function setMode(next){mode=next;controls.enabled=mode==='orbit';$('orbitBtn').classList.toggle('active',mode==='orbit');$('selectBtn').classList.toggle('active',mode==='select')}
    function startSelect(event){if(mode!=='select'||event.button!==0)return;drag={x:event.offsetX,y:event.offsetY};Object.assign($('selection').style,{display:'block',left:drag.x+'px',top:drag.y+'px',width:'0px',height:'0px'})}
    function moveSelect(event){if(!drag)return;const x=Math.min(drag.x,event.offsetX),y=Math.min(drag.y,event.offsetY);Object.assign($('selection').style,{left:x+'px',top:y+'px',width:Math.abs(event.offsetX-drag.x)+'px',height:Math.abs(event.offsetY-drag.y)+'px'})}
    function endSelect(){if(!drag)return;const box=$('selection').getBoundingClientRect(),rect=renderer.domElement.getBoundingClientRect();selectedIndices=[];if(points){const position=points.geometry.attributes.position;for(let i=0;i<position.count;i++){if(i>=state.n_vertices)continue;const projected=new THREE.Vector3().fromBufferAttribute(position,i).project(camera),sx=rect.left+(projected.x+1)*rect.width/2,sy=rect.top+(-projected.y+1)*rect.height/2;if(sx>=box.left&&sx<=box.right&&sy>=box.top&&sy<=box.bottom)selectedIndices.push(i)}}selectedIndices=[...new Set(selectedIndices)];drag=null;log('Selected '+selectedIndices.length+' static vertices')}
    function parsePointCloud(buffer){const view=new DataView(buffer);if(buffer.byteLength<4)throw Error('Point-cloud response is truncated');const n=view.getUint32(0,true),xyzOffset=4,colorOffset=xyzOffset+n*12,pidOffset=colorOffset+n*12;if(buffer.byteLength<pidOffset+n*4)throw Error('Point-cloud response has an invalid length');return {n,positions:new Float32Array(buffer,xyzOffset,n*3),colors:new Float32Array(buffer,colorOffset,n*3),partIds:new Int32Array(buffer,pidOffset,n)}}
    function buildPointCloud(posArray,colArray,pidArray){if(points){scene.remove(points);points.geometry.dispose();points.material.dispose()}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(posArray),3));geometry.setAttribute('color',new THREE.BufferAttribute(new Float32Array(colArray),3));points=new THREE.Points(geometry,new THREE.PointsMaterial({size:+$('pointSize').value,vertexColors:true,sizeAttenuation:true}));scene.add(points);originalPositions=new Float32Array(posArray);pointColors=new Float32Array(colArray);partIds=new Int32Array(pidArray);geometry.userData.nVertices=posArray.length/3;if(!camera.userData.fitted&&geometry.userData.nVertices){const box=new THREE.Box3().setFromObject(points),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length()||1;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size,-size,size*.7));camera.userData.fitted=true}}
    async function loadPointCloud(frame=null){const suffix=frame===null?'':'?frame='+encodeURIComponent(frame);try{const parsed=parsePointCloud(await api('/api/pointcloud'+suffix));buildPointCloud(parsed.positions,parsed.colors,parsed.partIds);$('status').textContent=(state.filename||'Point cloud')+' | '+parsed.n+' points | SH '+(state.sh_degree||0)+' | '+state.parts.length+' Parts';previewAllTransforms()}catch(error){log(error.message)}}
    function rotationMatrix(rx,ry,rz){const cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry),cz=Math.cos(rz),sz=Math.sin(rz);return [[cz*cy,cz*sy*sx-sz*cx,cz*sy*cx+sz*sx],[sz*cy,sz*sy*sx+cz*cx,sz*sy*cx-cz*sx],[-sy,cy*sx,cy*cx]]}
    function transformPoint(x,y,z,pivot,tf){const r=rotationMatrix(tf.rx,tf.ry,tf.rz),dx=x-pivot[0],dy=y-pivot[1],dz=z-pivot[2];return [r[0][0]*dx+r[0][1]*dy+r[0][2]*dz+pivot[0]+tf.tx,r[1][0]*dx+r[1][1]*dy+r[1][2]*dz+pivot[1]+tf.ty,r[2][0]*dx+r[2][1]*dy+r[2][2]*dz+pivot[2]+tf.tz]}
    function inputTransform(){return {tx:+$('tx').value||0,ty:+$('ty').value||0,tz:+$('tz').value||0,rx:+$('rx').value||0,ry:+$('ry').value||0,rz:+$('rz').value||0}}
    async function previewAllTransforms(){if(!points||!originalPositions||!partIds)return;let transforms={};try{transforms=await api('/api/frame_transforms/'+(+$('frameNumber').value||0))}catch(e){return}const current=selectedPid===null?null:inputTransform(),out=new Float32Array(originalPositions.length);for(let i=0;i<partIds.length;i++){const pid=partIds[i],part=state.parts.find(p=>p.id===pid),tf=pid===selectedPid?current:(transforms[String(pid)]||{tx:0,ty:0,tz:0,rx:0,ry:0,rz:0});const p=tf&&part?transformPoint(originalPositions[i*3],originalPositions[i*3+1],originalPositions[i*3+2],part.pivot,tf):[originalPositions[i*3],originalPositions[i*3+1],originalPositions[i*3+2]];out.set(p,i*3)}points.geometry.attributes.position.array.set(out);points.geometry.attributes.position.needsUpdate=true;if(selectedPid!==null){const part=state.parts.find(p=>p.id===selectedPid);if(part){if(!pivotMarker){pivotMarker=new THREE.Mesh(new THREE.SphereGeometry(.04,10,6),new THREE.MeshBasicMaterial({color:0xffc247}));scene.add(pivotMarker)}const tf=current||{tx:0,ty:0,tz:0};pivotMarker.position.set(part.pivot[0]+tf.tx,part.pivot[1]+tf.ty,part.pivot[2]+tf.tz)}}}
    async function refresh(){state=await api('/api/state');$('numFrames').value=state.num_frames;$('interp').value=state.interpolation_method;$('frameSlider').max=Math.max(1,state.num_frames-1);$('frameNumber').max=Math.max(1,state.num_frames-1);refreshParts();renderKeys();await loadPointCloud(+$('frameNumber').value||0)}
    async function uploadFiles(input,endpoint){const files=[...input.files];if(!files.length)return;const form=new FormData();files.forEach(file=>form.append('file',file));$('progress').textContent='Uploading...';try{await api(endpoint,{method:'POST',body:form});input.value='';await refresh();log('Upload complete')}catch(e){log(e.message)}$('progress').textContent=''}
    $('uploadBtn').onclick=()=>$('uploadInput').click();$('appendBtn').onclick=()=>$('appendInput').click();$('uploadInput').onchange=()=>uploadFiles($('uploadInput'),'/api/upload');$('appendInput').onchange=()=>uploadFiles($('appendInput'),'/api/upload_append');$('dirBtn').onclick=()=>$('dirModal').showModal();$('orbitBtn').onclick=()=>setMode('orbit');$('selectBtn').onclick=()=>setMode('select');$('pointSize').oninput=()=>{if(points)points.material.size=+$('pointSize').value};$('resetViewBtn').onclick=()=>{camera.userData.fitted=false;camera.position.set(3,-4,2.5);controls.target.set(0,0,0)};$('clearSelectionBtn').onclick=()=>{selectedIndices=[];$('selection').style.display='none'};
    $('createPartBtn').onclick=async()=>{if(!selectedIndices.length)return log('Select vertices first');try{await api('/api/parts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'',vertex_indices:selectedIndices})});selectedIndices=[];await refresh()}catch(e){log(e.message)}};$('deletePartBtn').onclick=async()=>{if(selectedPid===null)return;try{await api('/api/parts/'+selectedPid,{method:'DELETE'});selectedPid=null;await refresh()}catch(e){log(e.message)}};
    $('savePartBtn').onclick=async()=>{if(selectedPid===null)return;const hex=$('partColor').value;const rgb=[parseInt(hex.slice(1,3),16)/255,parseInt(hex.slice(3,5),16)/255,parseInt(hex.slice(5,7),16)/255];try{await api('/api/parts/'+selectedPid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('partName').value,pivot:[+$('px').value,+$('py').value,+$('pz').value],color:rgb})});await refresh();selectPart(selectedPid)}catch(e){log(e.message)}};$('centroidBtn').onclick=async()=>{if(selectedPid===null)return;try{const result=await api('/api/parts/'+selectedPid+'/centroid');['x','y','z'].forEach((axis,i)=>$('p'+axis).value=result.pivot[i]);await refresh();selectPart(selectedPid)}catch(e){log(e.message)}};
    $('setKeyBtn').onclick=async()=>{if(selectedPid===null)return;const frame=+$('frameNumber').value||0;try{await api('/api/keyframes/'+selectedPid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({frame,...inputTransform()})});await refresh();selectPart(selectedPid)}catch(e){log(e.message)}};$('saveSettingsBtn').onclick=async()=>{try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({num_frames:+$('numFrames').value,interpolation_method:$('interp').value})});await refresh()}catch(e){log(e.message)}};
    function setFrame(value){const frame=Math.max(0,Math.min(+$('frameSlider').max,+value||0));$('frameNumber').value=frame;$('frameSlider').value=frame;$('frameLabel').textContent=frame+' / '+$('frameSlider').max;$('playhead').style.left=(frame/Math.max(1,+$('frameSlider').max)*100)+'%';loadPointCloud(frame)}$('frameSlider').oninput=e=>setFrame(e.target.value);$('frameNumber').onchange=e=>setFrame(e.target.value);$('playBtn').onclick=()=>{if(playing)return;playing=setInterval(()=>setFrame((+$('frameNumber').value+1)%(+$('frameSlider').max+1)),100)};$('stopBtn').onclick=()=>{clearInterval(playing);playing=null};$('tx').oninput=$('ty').oninput=$('tz').oninput=$('rx').oninput=$('ry').oninput=$('rz').oninput=previewAllTransforms;
    $('loadDirBtn').onclick=async()=>{try{await api('/api/upload_4dgs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir_path:$('dirPath').value,loop:$('loopFrames').checked})});$('dirModal').close();await refresh();log('4DGS directory loaded')}catch(e){log(e.message)}};$('doCurrentBtn').onclick=async()=>{try{const result=await api('/api/export_current',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({output_path:$('currentPath').value,frame:+$('frameNumber').value})});$('currentModal').close();log('Exported '+result.output_path)}catch(e){log(e.message)}};$('doAllBtn').onclick=async()=>{try{const result=await api('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({output_dir:$('allPath').value})});$('allModal').close();$('progress').textContent='Exporting...';const poll=setInterval(async()=>{try{const status=await api('/api/export/status');$('progress').textContent=status.progress>=0?'Export '+status.progress+'%':'';if(status.done||status.progress<0){clearInterval(poll);if(status.done)log('All frames exported to '+status.output_dir)}}catch(e){clearInterval(poll);log(e.message)}},250)}catch(e){log(e.message)}};
    $('exportCurrentBtn').onclick=()=>$('currentModal').showModal();$('exportAllBtn').onclick=()=>$('allModal').showModal();document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).close());initThree();refresh().catch(e=>log(e.message));
  </script>
</body>
</html>
